<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="brandGrad" x1="0" y1="0" x2="160" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="wordGrad" x1="0" y1="0" x2="200" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="30%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#1a1d2e"/>
    </linearGradient>
  </defs>

  <!-- Icon: Premium rounded square -->
  <rect x="20" y="20" width="160" height="160" rx="40" fill="url(#brandGrad)"/>

  <!-- White house/roof silhouette -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Roof -->
    <path d="M52 100 L100 52 L148 100" stroke-width="14"/>
    <!-- Walls -->
    <path d="M76 100 L76 136 L124 136 L124 100" stroke-width="12"/>
    <!-- Door accent -->
    <path d="M96 136 L96 118 L108 118 L108 136" stroke-width="8"/>
    <!-- Decorative arch/growth curve -->
    <path d="M152 70 C168 56 180 70 172 88 C164 104 144 110 126 102" stroke-width="10"/>
    <!-- Small leaf accent -->
    <path d="M48 52 C36 42 28 56 40 66" stroke-width="8"/>
  </g>

  <!-- Wordmark -->
  <text x="210" y="118" font-family="'DM Sans',Arial,Helvetica,sans-serif" font-size="96" font-weight="700" fill="#1a1d2e" letter-spacing="-1">ghoroa</text>

  <!-- Tagline -->
  <text x="214" y="158" font-family="'DM Sans',Arial,Helvetica,sans-serif" font-size="22" font-weight="400" fill="#8a8fa8" letter-spacing="3">PROPERTY &bull; FINANCE &bull; FARM</text>
</svg>
